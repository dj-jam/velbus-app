# Manager is loopback-only. No published ports; Ingress Supervisor IP only.
pid /tmp/velbus-manager-nginx.pid;
error_log /tmp/velbus-nginx-error.log warn;
worker_processes 1;
events { worker_connections 256; }
http {
    # Do not log Referer: it can contain Home Assistant's bearer-like Ingress URL token.
    log_format ha_private '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';
    access_log /tmp/velbus-nginx-access.log ha_private;
    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    server {
        listen 8099;
        server_name _;
        client_max_body_size 8m;
        allow 172.30.32.2;
        deny all;
        add_header X-Content-Type-Options nosniff always;
        location / {
            proxy_pass http://127.0.0.1:4201;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_buffering off;
            proxy_redirect off;
        }
    }

    # Private HA Core -> Manager API. Port 8098 is NOT mapped to the HAOS host.
    # The per-installation secret is injected into a rootless, mode-0600 config
    # at runtime. Never expose the loopback Manager API directly.
    server {
        listen 8098;
        server_name _;
        client_max_body_size 8m;
        location ^~ /velbus/api/v2/ {
            if ($http_authorization != "Bearer __VELBUS_API_BEARER__") {
                return 401;
            }
            proxy_pass http://127.0.0.1:4201;
            proxy_http_version 1.1;
            proxy_set_header Authorization "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_buffering off;
            proxy_redirect off;
        }
        location / { return 404; }
    }
}
