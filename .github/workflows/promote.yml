name: Promote verified image to App Store
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version (e.g. 0.1.0-beta.1)'
        type: string
        required: true
  workflow_call:
    inputs:
      version:
        type: string
        required: true
permissions:
  contents: write
concurrency:
  group: velbus-app-catalog-promote
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Check anonymous multiarch image accessibility before updating the catalog
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^0\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]
          docker buildx imagetools inspect --raw "ghcr.io/dj-jam/velbus-manager2-ha:$VERSION" > /tmp/manifest.json
          python3 scripts/verify_manifest.py /tmp/manifest.json
      - name: Update app version only after publication
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/promote.py "$VERSION"
          git config user.name 'velbus-app[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add velbus_manager_2_beta/config.yaml velbus_manager_2_beta/CHANGELOG.md
          if git diff --cached --quiet; then
            echo 'Version already current.'
          else
            git commit -m "Publish Velbus Manager HA beta $VERSION"
            git push origin HEAD:main
          fi
